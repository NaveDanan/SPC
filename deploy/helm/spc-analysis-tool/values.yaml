# Default values for spc-analysis-tool Helm chart.
# Environment-agnostic defaults; override in values-<env>.yaml or via Kustomize overlays.

image:
  repository: ghcr.io/your-org/spc-web
  tag: "0.1.0" # Immutable tag RECOMMENDED to be replaced with digest in prod (e.g., sha256:...)
  pullPolicy: IfNotPresent

imagePullSecrets: [] # e.g., [{ name: regcred }]

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: spc.local
      paths:
        - path: /
          pathType: Prefix
  tls: [] # [{ hosts: [spc.local], secretName: spc-tls }]

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 70 # optional

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedEgressCIDRs: [] # e.g., ["0.0.0.0/0"] if external APIs needed
  allowDNS: true

ai:
  apiUrl: "" # Only used when gateway.enabled=false and the browser talks directly to an AI endpoint.
  apiKey: "" # Browser-side bearer token. In gateway mode this is only the browser->SPC token, not the upstream provider key.
  model: "" # Only used when gateway.enabled=false. In gateway mode the browser model is derived from gateway.env.AI_MODEL.

gateway:
  enabled: true
  # false = use the combined top-level image, which already embeds the DSPy gateway
  # true = run the gateway as its own Deployment/Service and use gateway.image below
  separateDeployment: false
  replicaCount: 1
  image:
    # Only used when gateway.separateDeployment=true
    repository: ghcr.io/your-org/spc-dspy-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    port: 8001
  ingress:
    apiPath: /v1/chat/completions
    pathType: Prefix
  env:
    AI_MODEL: ""
    AI_PROVIDER: ""
    AI_API_BASE: ""
    DSPY_API_BASE: ""
    DSPY_TEMPERATURE: "0"
    DSPY_MAX_TOKENS: "220"
    DSPY_TIMEOUT_SECONDS: "20"
  secretEnv:
    enabled: false
    data: {} # e.g., { AI_API_KEY: "...", AI_GATEWAY_API_KEY: "..." }
  externalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: default
      kind: ClusterSecretStore
    target:
      name: ""
    data: []
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

config:
  enabled: true
  runtimeEnv: default
  features: {}
  data: {}

secretEnv:
  enabled: false
  # when using External Secrets Operator, this block may be ignored.
  data: {}

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: spc-secret-env
  data: [] # list of { secretKey: "API_KEY", remoteRef: { key: "path/in/secret/store", property: "API_KEY" } }

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution: []
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [spc-analysis-tool]
          topologyKey: kubernetes.io/hostname

nodeSelector: {}

tolerations: []

priorityClassName: ""

rbac:
  create: true

limitRange:
  enabled: false
  default:
    cpu: 500m
    memory: 256Mi
  defaultRequest:
    cpu: 50m
    memory: 64Mi

resourceQuota:
  enabled: false
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "20"

