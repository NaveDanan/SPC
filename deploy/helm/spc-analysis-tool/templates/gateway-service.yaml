{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spc.gatewayFullname" . }}
  labels:
    {{- include "spc.gatewayLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "spc.gatewaySelectorLabels" . | nindent 4 }}
{{- end }}