{{- if and .Values.gateway.enabled .Values.gateway.secretEnv.enabled (not .Values.gateway.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spc.gatewaySecretName" . }}
  labels:
    {{- include "spc.gatewayLabels" . | nindent 4 }}
stringData:
  {{- range $k, $v := .Values.gateway.secretEnv.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}