apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spc.fullname" . }}
  labels:
    {{- include "spc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "spc.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "spc.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.gateway.secretEnv.enabled (not .Values.gateway.externalSecret.enabled) }}
        checksum/gateway-secret: {{ include (print $.Template.BasePath "/gateway-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secretEnv.enabled }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "spc.fullname" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: spc-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AI_MODEL
              value: {{ default .Values.ai.model .Values.gateway.env.AI_MODEL | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.gateway.env.AI_PROVIDER | quote }}
            - name: AI_API_BASE
              value: {{ .Values.gateway.env.AI_API_BASE | quote }}
            - name: DSPY_API_BASE
              value: {{ .Values.gateway.env.DSPY_API_BASE | quote }}
            - name: DSPY_TEMPERATURE
              value: {{ .Values.gateway.env.DSPY_TEMPERATURE | quote }}
            - name: DSPY_MAX_TOKENS
              value: {{ .Values.gateway.env.DSPY_MAX_TOKENS | quote }}
            - name: DSPY_TIMEOUT_SECONDS
              value: {{ .Values.gateway.env.DSPY_TIMEOUT_SECONDS | quote }}
            - name: AI_GATEWAY_PORT
              value: "8080"
            - name: SPC_WEB_DIST_DIR
              value: /app/spc-web-dist
          {{- if or .Values.gateway.secretEnv.enabled .Values.gateway.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "spc.gatewaySecretName" . }}
          {{- end }}
          volumeMounts:
            {{- if .Values.config.enabled }}
            - name: runtime-config
              mountPath: /app/spc-web-dist/config
            {{- end }}
            - name: app-tmp
              mountPath: /tmp
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: app-tmp
          emptyDir: {}
        {{- if .Values.config.enabled }}
        - name: runtime-config
          configMap:
            name: {{ include "spc.fullname" . }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
