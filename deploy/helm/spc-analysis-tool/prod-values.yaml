# Production values for spc-analysis-tool (used by ArgoCD)

image:
  # Replace with your offline/private registry
  repository: registry.internal.example.com/spc/spc-analysis-tool
  # Prefer immutable digests for prod (example shows tag for readability)
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

replicaCount: 3

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: spc.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [spc.example.internal]
      secretName: spc-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Tighten this to provider-specific ranges if your environment requires it.
  allowedEgressCIDRs:
    - 0.0.0.0/0
  allowDNS: true

ai:
  apiUrl: ""
  apiKey: ""
  model: ""

gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: registry.internal.example.com/spc/dspy-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    port: 8001
  ingress:
    apiPath: /v1/chat/completions
    pathType: Prefix
  env:
    AI_MODEL: ""
    AI_PROVIDER: ""
    AI_API_BASE: ""
    DSPY_API_BASE: ""
    DSPY_TEMPERATURE: "0"
    DSPY_MAX_TOKENS: "220"
    DSPY_TIMEOUT_SECONDS: "20"
  secretEnv:
    enabled: false
    data: {}
  externalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: default
      kind: ClusterSecretStore
    target:
      name: ""
    data: []
  caBundle:
    enabled: false
    existingSecretName: ""
    secretKey: ca.crt
    mountPath: /app/certs/custom-ca-bundle.pem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

config:
  enabled: true
  data:
    runtime-config.js: |
      window.APP_CONFIG = {
        ENV: "prod",
        FEATURES: {},
        AI: {
          API_URL: {{ default (ternary .Values.gateway.ingress.apiPath "" (and .Values.gateway.enabled .Values.ingress.enabled)) .Values.ai.apiUrl | quote }},
          API_KEY: {{ .Values.ai.apiKey | quote }},
          MODEL: {{ default .Values.gateway.env.AI_MODEL .Values.ai.model | quote }},
        },
      };

secretEnv:
  enabled: false

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: spc-secret-env
  data: []

serviceAccount:
  create: true
  annotations: {}

nginxExporter:
  enabled: false

serviceMonitor:
  enabled: false

rbac:
  create: false

limitRange:
  enabled: false

resourceQuota:
  enabled: false

priorityClassName: ""

nodeSelector: {}
affinity: {}
tolerations: []

